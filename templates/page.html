<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ doc }} · ${{ root }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Roboto+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* MkDocs Material–inspired theme — Primary: teal · Accent: amber */
:root {
  --md-primary-fg-color: #009688;
  --md-primary-fg-color--light: #4db6ac;
  --md-primary-fg-color--dark: #00796b;
  --md-primary-bg-color: #ffffff;
  --md-primary-bg-color--light: rgba(255, 255, 255, 0.7);
  --md-accent-fg-color: #ffab00;
  --md-accent-fg-color--transparent: rgba(255, 171, 0, 0.1);
  --md-accent-bg-color: #ffffff;
  --md-default-fg-color: rgba(0, 0, 0, 0.87);
  --md-default-fg-color--light: rgba(0, 0, 0, 0.54);
  --md-default-fg-color--lighter: rgba(0, 0, 0, 0.32);
  --md-default-fg-color--lightest: rgba(0, 0, 0, 0.07);
  --md-default-bg-color: #ffffff;
  --md-default-bg-color--light: #fafafa;
  --md-default-bg-color--lighter: #f5f5f5;
  --md-code-fg-color: #37474f;
  --md-code-bg-color: #f5f5f5;
  --md-typeset-a-color: var(--md-primary-fg-color);
  --md-admonition-bg: #fff8e1;
  --err-color: #c62828;
  --err-bg: #fdecea;
  --md-header-height: 2.8rem;
  --md-content-max: 46rem;
  --md-mermaid-font-family: "Roboto", sans-serif;
  --md-mermaid-edge-color: var(--md-code-fg-color);
  --md-mermaid-node-bg-color: var(--md-accent-fg-color--transparent);
  --md-mermaid-node-fg-color: var(--md-accent-fg-color);
  --md-mermaid-label-bg-color: var(--md-default-bg-color);
  --md-mermaid-label-fg-color: var(--md-code-fg-color);
  --md-mermaid-sequence-actor-bg-color: var(--md-mermaid-label-bg-color);
  --md-mermaid-sequence-actor-fg-color: var(--md-mermaid-label-fg-color);
  --md-mermaid-sequence-actor-border-color: var(--md-mermaid-node-fg-color);
  --md-mermaid-sequence-actor-line-color: var(--md-default-fg-color--lighter);
  --md-mermaid-sequence-actorman-bg-color: var(--md-mermaid-label-bg-color);
  --md-mermaid-sequence-actorman-line-color: var(--md-mermaid-node-fg-color);
  --md-mermaid-sequence-box-bg-color: var(--md-mermaid-node-bg-color);
  --md-mermaid-sequence-box-fg-color: var(--md-mermaid-edge-color);
  --md-mermaid-sequence-label-bg-color: var(--md-mermaid-node-bg-color);
  --md-mermaid-sequence-label-fg-color: var(--md-mermaid-node-fg-color);
  --md-mermaid-sequence-loop-bg-color: var(--md-mermaid-node-bg-color);
  --md-mermaid-sequence-loop-fg-color: var(--md-mermaid-edge-color);
  --md-mermaid-sequence-loop-border-color: var(--md-mermaid-node-fg-color);
  --md-mermaid-sequence-message-fg-color: var(--md-mermaid-edge-color);
  --md-mermaid-sequence-message-line-color: var(--md-mermaid-edge-color);
  --md-mermaid-sequence-note-bg-color: var(--md-mermaid-label-bg-color);
  --md-mermaid-sequence-note-fg-color: var(--md-mermaid-edge-color);
  --md-mermaid-sequence-note-border-color: var(--md-mermaid-label-fg-color);
  --md-mermaid-sequence-number-bg-color: var(--md-mermaid-node-fg-color);
  --md-mermaid-sequence-number-fg-color: var(--md-accent-bg-color);
}
@media (prefers-color-scheme: dark) {
  :root {
    --md-primary-fg-color: #4db6ac;
    --md-primary-fg-color--light: #80cbc4;
    --md-primary-fg-color--dark: #00897b;
    --md-primary-bg-color: #1e1e1e;
    --md-accent-fg-color: #ffca28;
    --md-accent-fg-color--transparent: rgba(255, 202, 40, 0.15);
    --md-accent-bg-color: #1e1e1e;
    --md-default-fg-color: rgba(255, 255, 255, 0.87);
    --md-default-fg-color--light: rgba(255, 255, 255, 0.60);
    --md-default-fg-color--lighter: rgba(255, 255, 255, 0.38);
    --md-default-fg-color--lightest: rgba(255, 255, 255, 0.12);
    --md-default-bg-color: #121212;
    --md-default-bg-color--light: #1e1e1e;
    --md-default-bg-color--lighter: #2a2a2a;
    --md-code-fg-color: #e0e0e0;
    --md-code-bg-color: #1e1e1e;
    --md-typeset-a-color: var(--md-primary-fg-color);
    --md-admonition-bg: #3e2723;
    --err-color: #ef9a9a;
    --err-bg: #3e1f1c;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-weight: 400; line-height: 1.6;
  color: var(--md-default-fg-color);
  background-color: var(--md-default-bg-color);
  -webkit-font-smoothing: antialiased;
}
header {
  position: sticky; top: 0; z-index: 10; height: var(--md-header-height);
  display: flex; align-items: center; padding: 0 1.2rem;
  background-color: var(--md-primary-fg-color); color: #fff;
  font-size: 0.85rem; font-weight: 500;
  box-shadow: 0 0 0.2rem rgba(0,0,0,0.1), 0 0.2rem 0.4rem rgba(0,0,0,0.2);
}
header b { font-weight: 700; opacity: 0.95; }
header span { opacity: 0.85; margin: 0 0.35rem; }
main { max-width: var(--md-content-max); margin: 0 auto; padding: 1.8rem 1.25rem 4.5rem; }
h1,h2,h3,h4,h5,h6 { font-family: "Roboto", sans-serif; font-weight: 700; line-height: 1.25; color: var(--md-default-fg-color); margin: 1.6em 0 0.6em; }
h1 { font-size: 1.9rem; margin-top: 0; }
h2 { font-size: 1.45rem; border-bottom: 1px solid var(--md-default-fg-color--lightest); padding-bottom: 0.3em; }
h3 { font-size: 1.2rem; }
p { margin: 0.9em 0; }
a { color: var(--md-typeset-a-color); text-decoration: none; }
a:hover, a:focus { color: var(--md-accent-fg-color); text-decoration: underline; text-underline-offset: 2px; }
ul, ol { margin: 0.8em 0; padding-left: 1.6em; }
table { width: 100%; border-collapse: collapse; margin: 1.2em 0; font-size: 0.92rem; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--md-default-fg-color--lightest); padding: 0.55rem 0.9rem; text-align: left; }
th { background: var(--md-default-bg-color--lighter); font-weight: 500; }
:not(pre) > code {
  font-family: "Roboto Mono", ui-monospace, monospace; font-size: 0.85em;
  background: var(--md-code-bg-color); color: var(--md-code-fg-color);
  padding: 0.12em 0.35em; border-radius: 0.2rem;
}
figure.include {
  margin: 1.6rem 0; border-radius: 0.3rem; overflow: hidden;
  border: 1px solid var(--md-default-fg-color--lightest);
  background: var(--md-code-bg-color);
}
figure.include figcaption {
  padding: 0.4rem 0.9rem; font-family: "Roboto Mono", monospace; font-size: 0.72rem; font-weight: 500;
  color: var(--md-primary-fg-color); background: var(--md-default-bg-color--light);
  border-bottom: 1px solid var(--md-default-fg-color--lightest);
}
figure .highlight { margin: 0 !important; background: transparent !important; }
figure .highlight pre {
  margin: 0; padding: 0.9rem 1.1rem; overflow-x: auto;
  font-family: "Roboto Mono", monospace; font-size: 0.82rem; line-height: 1.55;
  background: transparent !important; color: var(--md-code-fg-color);
}
figure.diagram { background: var(--md-default-bg-color); }
figure.diagram pre.mermaid {
  margin: 0; padding: 1.4rem 1.2rem; text-align: center; overflow-x: auto;
  display: flex; justify-content: center;
}
figure.diagram .mermaid svg { max-width: 100%; height: auto; }
.include-error {
  margin: 1.4rem 0; padding: 0.75rem 1rem; border-left: 4px solid var(--err-color);
  background: var(--err-bg); color: var(--err-color);
  font-family: "Roboto Mono", monospace; font-size: 0.82rem; white-space: pre-wrap;
}
blockquote {
  margin: 1.2em 0; padding: 0.6em 1em; border-left: 4px solid var(--md-primary-fg-color);
  background: var(--md-default-bg-color--light); color: var(--md-default-fg-color--light);
}
hr { border: none; border-top: 1px solid var(--md-default-fg-color--lightest); margin: 2em 0; }
{{ css|safe }}
.highlight { background: var(--md-code-bg-color) !important; }
.highlight pre { background: transparent !important; }
</style>
</head>
<body>
<header>
  <b>${{ root }}</b>
  <span>/</span>
  {{ doc }}
</header>
<main>
  {{ html|safe }}
</main>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  const themeCSS = `.node circle,.node ellipse,.node path,.node polygon,.node rect{fill:var(--md-mermaid-node-bg-color);stroke:var(--md-mermaid-node-fg-color)}marker{fill:var(--md-mermaid-edge-color)!important}.label{color:var(--md-mermaid-label-fg-color);font-family:var(--md-mermaid-font-family)}.edgePath .path,.flowchart-link{stroke:var(--md-mermaid-edge-color)}.edgePath .arrowheadPath{fill:var(--md-mermaid-edge-color);stroke:none}.cluster rect{fill:var(--md-default-fg-color--lightest);stroke:var(--md-default-fg-color--lighter)}.nodeLabel,.nodeLabel p{color:var(--md-mermaid-label-fg-color);font-family:var(--md-mermaid-font-family)}.actor{fill:var(--md-mermaid-sequence-actor-bg-color);stroke:var(--md-mermaid-sequence-actor-border-color)}text.actor>tspan{fill:var(--md-mermaid-sequence-actor-fg-color)}.messageLine0,.messageLine1{stroke:var(--md-mermaid-sequence-message-line-color)}.note{fill:var(--md-mermaid-sequence-note-bg-color);stroke:var(--md-mermaid-sequence-note-border-color)}.messageText{fill:var(--md-mermaid-sequence-message-fg-color)}`;
  mermaid.initialize({
    startOnLoad: true,
    securityLevel: "loose",
    themeCSS,
    sequence: { actorFontSize: "16px", messageFontSize: "16px", noteFontSize: "16px" }
  });
</script>
</body>
</html>
