<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ doc }} · ${{ root }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Roboto+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   MkDocs Material–inspired theme
   Primary: teal  ·  Accent: amber
   ------------------------------------------------------------------ */
:root {
  /* Primary (teal) */
  --md-primary-fg-color:        #009688;
  --md-primary-fg-color--light: #4db6ac;
  --md-primary-fg-color--dark:  #00796b;
  --md-primary-bg-color:        #ffffff;
  --md-primary-bg-color--light: rgba(255, 255, 255, 0.7);

  /* Accent (amber) */
  --md-accent-fg-color:            #ffab00;
  --md-accent-fg-color--transparent: rgba(255, 171, 0, 0.1);
  --md-accent-bg-color:            #ffffff;

  /* Default (light) */
  --md-default-fg-color:           rgba(0, 0, 0, 0.87);
  --md-default-fg-color--light:    rgba(0, 0, 0, 0.54);
  --md-default-fg-color--lighter:  rgba(0, 0, 0, 0.32);
  --md-default-fg-color--lightest: rgba(0, 0, 0, 0.07);
  --md-default-bg-color:           #ffffff;
  --md-default-bg-color--light:    #fafafa;
  --md-default-bg-color--lighter:  #f5f5f5;

  /* Code */
  --md-code-fg-color:  #37474f;
  --md-code-bg-color:  #f5f5f5;

  /* Typeset / links */
  --md-typeset-a-color: var(--md-primary-fg-color);

  /* Admonition / error */
  --md-admonition-bg:   #fff8e1;
  --err-color:          #c62828;
  --err-bg:             #fdecea;

  /* Layout */
  --md-header-height: 2.8rem;
  --md-content-max:   46rem;

  /* Mermaid – exact same variable set Material uses */
  --md-mermaid-font-family:            "Roboto", sans-serif;
  --md-mermaid-edge-color:             var(--md-code-fg-color);
  --md-mermaid-node-bg-color:          var(--md-accent-fg-color--transparent);
  --md-mermaid-node-fg-color:          var(--md-accent-fg-color);
  --md-mermaid-label-bg-color:         var(--md-default-bg-color);
  --md-mermaid-label-fg-color:         var(--md-code-fg-color);

  --md-mermaid-sequence-actor-bg-color:      var(--md-mermaid-label-bg-color);
  --md-mermaid-sequence-actor-fg-color:      var(--md-mermaid-label-fg-color);
  --md-mermaid-sequence-actor-border-color:  var(--md-mermaid-node-fg-color);
  --md-mermaid-sequence-actor-line-color:    var(--md-default-fg-color--lighter);
  --md-mermaid-sequence-actorman-bg-color:   var(--md-mermaid-label-bg-color);
  --md-mermaid-sequence-actorman-line-color: var(--md-mermaid-node-fg-color);
  --md-mermaid-sequence-box-bg-color:        var(--md-mermaid-node-bg-color);
  --md-mermaid-sequence-box-fg-color:        var(--md-mermaid-edge-color);
  --md-mermaid-sequence-label-bg-color:      var(--md-mermaid-node-bg-color);
  --md-mermaid-sequence-label-fg-color:      var(--md-mermaid-node-fg-color);
  --md-mermaid-sequence-loop-bg-color:       var(--md-mermaid-node-bg-color);
  --md-mermaid-sequence-loop-fg-color:       var(--md-mermaid-edge-color);
  --md-mermaid-sequence-loop-border-color:   var(--md-mermaid-node-fg-color);
  --md-mermaid-sequence-message-fg-color:    var(--md-mermaid-edge-color);
  --md-mermaid-sequence-message-line-color:  var(--md-mermaid-edge-color);
  --md-mermaid-sequence-note-bg-color:       var(--md-mermaid-label-bg-color);
  --md-mermaid-sequence-note-fg-color:       var(--md-mermaid-edge-color);
  --md-mermaid-sequence-note-border-color:   var(--md-mermaid-label-fg-color);
  --md-mermaid-sequence-number-bg-color:     var(--md-mermaid-node-fg-color);
  --md-mermaid-sequence-number-fg-color:     var(--md-accent-bg-color);
}

/* Dark / slate scheme */
@media (prefers-color-scheme: dark) {
  :root {
    --md-primary-fg-color:        #4db6ac;
    --md-primary-fg-color--light: #80cbc4;
    --md-primary-fg-color--dark:  #00897b;
    --md-primary-bg-color:        #1e1e1e;

    --md-accent-fg-color:              #ffca28;
    --md-accent-fg-color--transparent: rgba(255, 202, 40, 0.15);
    --md-accent-bg-color:              #1e1e1e;

    --md-default-fg-color:           rgba(255, 255, 255, 0.87);
    --md-default-fg-color--light:    rgba(255, 255, 255, 0.60);
    --md-default-fg-color--lighter:  rgba(255, 255, 255, 0.38);
    --md-default-fg-color--lightest: rgba(255, 255, 255, 0.12);
    --md-default-bg-color:           #121212;
    --md-default-bg-color--light:    #1e1e1e;
    --md-default-bg-color--lighter:  #2a2a2a;

    --md-code-fg-color:  #e0e0e0;
    --md-code-bg-color:  #1e1e1e;

    --md-typeset-a-color: var(--md-primary-fg-color);

    --md-admonition-bg:   #3e2723;
    --err-color:          #ef9a9a;
    --err-bg:             #3e1f1c;
  }
}

/* ------------------------------------------------------------------ base */
*, *::before, *::after { box-sizing: border-box; }

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI",
               Helvetica, Arial, sans-serif;
  font-weight: 400;
  line-height: 1.6;
  color: var(--md-default-fg-color);
  background-color: var(--md-default-bg-color);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ------------------------------------------------------------------ header */
header {
  position: sticky;
  top: 0;
  z-index: 10;
  height: var(--md-header-height);
  display: flex;
  align-items: center;
  padding: 0 1.2rem;
  background-color: var(--md-primary-fg-color);
  color: #fff;
  font-family: "Roboto", sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  box-shadow: 0 0 0.2rem rgba(0, 0, 0, 0.1),
              0 0.2rem 0.4rem rgba(0, 0, 0, 0.2);
}

header b {
  font-weight: 700;
  opacity: 0.95;
}

header span {
  opacity: 0.85;
  margin: 0 0.35rem;
}

/* ------------------------------------------------------------------ content */
main {
  max-width: var(--md-content-max);
  margin: 0 auto;
  padding: 1.8rem 1.25rem 4.5rem;
}

/* ------------------------------------------------------------------ typography */
h1, h2, h3, h4, h5, h6 {
  font-family: "Roboto", sans-serif;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--md-default-fg-color);
  margin: 1.6em 0 0.6em;
}

h1 { font-size: 1.9rem; font-weight: 700; margin-top: 0; }
h2 { font-size: 1.45rem; border-bottom: 1px solid var(--md-default-fg-color--lightest); padding-bottom: 0.3em; }
h3 { font-size: 1.2rem; }
h4 { font-size: 1.05rem; }

p { margin: 0.9em 0; }

a {
  color: var(--md-typeset-a-color);
  text-decoration: none;
  transition: color 0.15s ease;
}
a:hover,
a:focus {
  color: var(--md-accent-fg-color);
  text-decoration: underline;
  text-underline-offset: 2px;
}

strong, b { font-weight: 700; }
em, i { font-style: italic; }

/* ------------------------------------------------------------------ lists & tables */
ul, ol {
  margin: 0.8em 0;
  padding-left: 1.6em;
}
li { margin: 0.25em 0; }

table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.2em 0;
  font-size: 0.92rem;
  display: block;
  overflow-x: auto;
}
th, td {
  border: 1px solid var(--md-default-fg-color--lightest);
  padding: 0.55rem 0.9rem;
  text-align: left;
}
th {
  background: var(--md-default-bg-color--lighter);
  font-weight: 500;
  color: var(--md-default-fg-color);
}
tr:nth-child(even) td {
  background: var(--md-default-bg-color--light);
}

/* ------------------------------------------------------------------ inline code */
:not(pre) > code {
  font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.85em;
  background: var(--md-code-bg-color);
  color: var(--md-code-fg-color);
  padding: 0.12em 0.35em;
  border-radius: 0.2rem;
  word-break: break-word;
}

/* ------------------------------------------------------------------ figures / includes */
figure.include {
  margin: 1.6rem 0;
  border-radius: 0.3rem;
  overflow: hidden;
  border: 1px solid var(--md-default-fg-color--lightest);
  background: var(--md-code-bg-color);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
}

figure.include figcaption {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.4rem 0.9rem;
  font-family: "Roboto Mono", monospace;
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--md-primary-fg-color);
  background: var(--md-default-bg-color--light);
  border-bottom: 1px solid var(--md-default-fg-color--lightest);
  letter-spacing: 0.01em;
}

figure .highlight {
  margin: 0 !important;
  background: transparent !important;
}
figure .highlight pre {
  margin: 0;
  padding: 0.9rem 1.1rem;
  overflow-x: auto;
  font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.82rem;
  line-height: 1.55;
  background: transparent !important;
  color: var(--md-code-fg-color);
}

/* Mermaid diagrams – Material-style container */
figure.diagram {
  background: var(--md-default-bg-color);
  border: 1px solid var(--md-default-fg-color--lightest);
}
figure.diagram figcaption {
  background: var(--md-default-bg-color--light);
}
figure.diagram pre.mermaid {
  margin: 0;
  padding: 1.4rem 1.2rem;
  text-align: center;
  overflow-x: auto;
  background: transparent;
  display: flex;
  justify-content: center;
}
figure.diagram .mermaid svg {
  max-width: 100%;
  height: auto;
}

/* ------------------------------------------------------------------ error blocks */
.include-error {
  margin: 1.4rem 0;
  padding: 0.75rem 1rem;
  border-left: 4px solid var(--err-color);
  background: var(--err-bg);
  color: var(--err-color);
  font-family: "Roboto Mono", monospace;
  font-size: 0.82rem;
  line-height: 1.5;
  white-space: pre-wrap;
  border-radius: 0 0.25rem 0.25rem 0;
}

/* ------------------------------------------------------------------ blockquotes */
blockquote {
  margin: 1.2em 0;
  padding: 0.6em 1em;
  border-left: 4px solid var(--md-primary-fg-color);
  background: var(--md-default-bg-color--light);
  color: var(--md-default-fg-color--light);
  border-radius: 0 0.25rem 0.25rem 0;
}
blockquote p { margin: 0.4em 0; }

/* ------------------------------------------------------------------ hr */
hr {
  border: none;
  border-top: 1px solid var(--md-default-fg-color--lightest);
  margin: 2em 0;
}

/* ------------------------------------------------------------------ Pygments (injected) */
{{ css|safe }}

/* Make sure Pygments respects our code background */
.highlight {
  background: var(--md-code-bg-color) !important;
}
.highlight pre {
  background: transparent !important;
}

/* Soften some Pygments defaults for better Material feel */
.highlight .hll { background-color: rgba(255, 171, 0, 0.15); }
</style>
</head>
<body>
<header>
  <b>${{ root }}</b>
  <span>/</span>
  {{ doc }}
</header>
<main>
  {{ html|safe }}
</main>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

  // Material for MkDocs approach: inject themeCSS that references
  // --md-mermaid-* CSS variables. No hardcoded colors, no themeVariables.
  const themeCSS = `.node circle,
.node ellipse,
.node path,
.node polygon,
.node rect {
  fill: var(--md-mermaid-node-bg-color);
  stroke: var(--md-mermaid-node-fg-color);
}
marker {
  fill: var(--md-mermaid-edge-color) !important;
}
.edgeLabel .label rect {
  fill: transparent;
}
.flowchartTitleText {
  fill: var(--md-mermaid-label-fg-color);
}
.label {
  color: var(--md-mermaid-label-fg-color);
  font-family: var(--md-mermaid-font-family);
}
.label foreignObject {
  overflow: visible;
  line-height: initial;
}
.label div .edgeLabel {
  color: var(--md-mermaid-label-fg-color);
  background-color: var(--md-mermaid-label-bg-color);
}
.edgeLabel,
.edgeLabel p {
  color: var(--md-mermaid-edge-color);
  background-color: var(--md-mermaid-label-bg-color);
  fill: var(--md-mermaid-label-bg-color);
}
.edgePath .path,
.flowchart-link {
  stroke: var(--md-mermaid-edge-color);
}
.edgePath .arrowheadPath {
  fill: var(--md-mermaid-edge-color);
  stroke: none;
}
.cluster rect {
  fill: var(--md-default-fg-color--lightest);
  stroke: var(--md-default-fg-color--lighter);
}
.cluster span {
  color: var(--md-mermaid-label-fg-color);
  font-family: var(--md-mermaid-font-family);
}
g #flowchart-circleStart,
g #flowchart-circleEnd,
g #flowchart-crossStart,
g #flowchart-crossEnd,
g #flowchart-pointStart,
g #flowchart-pointEnd {
  stroke: none;
}
.classDiagramTitleText {
  fill: var(--md-mermaid-label-fg-color);
}
g.classGroup line,
g.classGroup rect {
  fill: var(--md-mermaid-node-bg-color);
  stroke: var(--md-mermaid-node-fg-color);
}
g.classGroup text {
  font-family: var(--md-mermaid-font-family);
  fill: var(--md-mermaid-label-fg-color);
}
.classLabel .box {
  background-color: var(--md-mermaid-label-bg-color);
  opacity: 1;
  fill: var(--md-mermaid-label-bg-color);
}
.classLabel .label {
  font-family: var(--md-mermaid-font-family);
  fill: var(--md-mermaid-label-fg-color);
}
.node .divider {
  stroke: var(--md-mermaid-node-fg-color);
}
.relation {
  stroke: var(--md-mermaid-edge-color);
}
.cardinality {
  font-family: var(--md-mermaid-font-family);
  fill: var(--md-mermaid-label-fg-color);
}
.cardinality text {
  fill: inherit !important;
}
defs marker.marker.extension.class path,
defs marker.marker.composition.class path ,
defs marker.marker.dependency.class path  {
  fill: var(--md-mermaid-edge-color) !important;
  stroke: var(--md-mermaid-edge-color) !important;
}
defs marker.marker.aggregation.class path  {
  fill: var(--md-mermaid-label-bg-color) !important;
  stroke: var(--md-mermaid-edge-color) !important;
}
.statediagramTitleText {
  fill: var(--md-mermaid-label-fg-color);
}
g.stateGroup rect {
  fill: var(--md-mermaid-node-bg-color);
  stroke: var(--md-mermaid-node-fg-color);
}
g.stateGroup .state-title {
  font-family: var(--md-mermaid-font-family);
  fill: var(--md-mermaid-label-fg-color) !important;
}
g.stateGroup .composit {
  fill: var(--md-mermaid-label-bg-color);
}
.nodeLabel,
.nodeLabel p {
  color: var(--md-mermaid-label-fg-color);
  font-family: var(--md-mermaid-font-family);
}
a .nodeLabel {
  text-decoration: underline;
}
.start-state,
.node circle.state-start,
.node circle.state-end {
  fill: var(--md-mermaid-edge-color);
  stroke: none;
}
.end-state-outer,
.end-state-inner {
  fill: var(--md-mermaid-edge-color);
}
.end-state-inner,
.node circle.state-end {
  stroke: var(--md-mermaid-label-bg-color);
}
.transition {
  stroke: var(--md-mermaid-edge-color);
}
[id^=state-fork] rect,
[id^=state-join] rect {
  fill: var(--md-mermaid-edge-color) !important;
  stroke: none !important;
}
.statediagram-cluster.statediagram-cluster .inner {
  fill: var(--md-default-bg-color);
}
.statediagram-cluster rect {
  fill: var(--md-mermaid-node-bg-color);
  stroke: var(--md-mermaid-node-fg-color);
}
.statediagram-state rect.divider {
  fill: var(--md-default-fg-color--lightest);
  stroke: var(--md-default-fg-color--lighter);
}
defs #statediagram-barbEnd {
  stroke: var(--md-mermaid-edge-color);
}
[id^=entity] rect,
[id^=entity] path {
  fill: var(--md-default-bg-color);
}
.relationshipLine {
  stroke: var(--md-mermaid-edge-color);
}
defs .marker.onlyOne.er *,
defs .marker.zeroOrOne.er *,
defs .marker.oneOrMore.er *,
defs .marker.zeroOrMore.er * {
  stroke: var(--md-mermaid-edge-color) !important;
}
text:not([class]):last-child {
  fill: var(--md-mermaid-label-fg-color);
}
.actor {
  fill: var(--md-mermaid-sequence-actor-bg-color);
  stroke: var(--md-mermaid-sequence-actor-border-color);
}
text.actor > tspan {
  font-family: var(--md-mermaid-font-family);
  fill: var(--md-mermaid-sequence-actor-fg-color);
}
line {
  stroke: var(--md-mermaid-sequence-actor-line-color);
}
.actor-man circle,
.actor-man line {
  fill: var(--md-mermaid-sequence-actorman-bg-color);
  stroke: var(--md-mermaid-sequence-actorman-line-color);
}
.messageLine0,
.messageLine1 {
  stroke: var(--md-mermaid-sequence-message-line-color);
}
.note {
  fill: var(--md-mermaid-sequence-note-bg-color);
  stroke: var(--md-mermaid-sequence-note-border-color);
}
.messageText,
.loopText,
.loopText > tspan,
.noteText > tspan {
  font-family: var(--md-mermaid-font-family) !important;
  stroke: none;
}
.messageText {
  fill: var(--md-mermaid-sequence-message-fg-color);
}
.loopText,
.loopText > tspan {
  fill: var(--md-mermaid-sequence-loop-fg-color);
}
.noteText > tspan {
  fill: var(--md-mermaid-sequence-note-fg-color);
}
#arrowhead path {
  fill: var(--md-mermaid-sequence-message-line-color);
  stroke: none;
}
.loopLine {
  fill: var(--md-mermaid-sequence-loop-bg-color);
  stroke: var(--md-mermaid-sequence-loop-border-color);
}
.labelBox {
  fill: var(--md-mermaid-sequence-label-bg-color);
  stroke: none;
}
.labelText,
.labelText > span {
  font-family: var(--md-mermaid-font-family);
  fill: var(--md-mermaid-sequence-label-fg-color);
}
.sequenceNumber {
  fill: var(--md-mermaid-sequence-number-fg-color);
}
rect.rect {
  fill: var(--md-mermaid-sequence-box-bg-color);
  stroke: none;
}
rect.rect + text.text {
  fill: var(--md-mermaid-sequence-box-fg-color);
}
defs #sequencenumber {
  fill: var(--md-mermaid-sequence-number-bg-color) !important;
}`;

  mermaid.initialize({
    startOnLoad: true,
    securityLevel: "loose",
    themeCSS,
    sequence: {
      actorFontSize: "16px",
      messageFontSize: "16px",
      noteFontSize: "16px"
    }
  });
</script>
</body>
</html>
